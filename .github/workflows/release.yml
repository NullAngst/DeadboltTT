name: Release

# Runs when a release is published on GitHub, whatever its tag is named, and
# attaches the packages to it. Run it by hand from the Actions tab to build
# and attach to an existing release, or to rebuild one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (example: v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Release exists for this tag
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Version from tag
        # v1.2.3 and V1.2.3 both give 1.2.3. Anything else stops here with a
        # clear message instead of failing inside nfpm.
        run: |
          v="${TAG#[vV]}"
          case "$v" in
            [0-9]*) printf 'VERSION=%s\n' "$v" >> "$GITHUB_ENV" ;;
            *) printf 'Tag %s does not look like a version. Use v1.2.3.\n' "$TAG" >&2; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable

      - name: Current crates
        # Releases ship current crates: no exact pins, update right before building.
        run: cargo update

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Gate on known-vulnerable crates
        run: |
          cargo audit
          cargo deny check

      - name: Build
        run: cargo build --release --locked

      - name: Packages
        run: |
          pipx install nfpm
          bash packaging/build-packages.sh "$VERSION"

      - name: Source tarball
        run: git archive --format=tar.gz --prefix="DeadboltTT-$VERSION/" -o "dist/DeadboltTT-$VERSION.tar.gz" HEAD

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Attach to the release
        # --clobber replaces files of the same name, so a rerun is safe.
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
