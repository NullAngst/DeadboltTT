[workspace]
resolver = "3"
members = [
    "crates/deadbolt-common",
    "crates/deadbolt-shield",
    "crates/deadboltd",
    "crates/deadbolt-worker",
    "crates/deadbolt-client",
    "crates/deadbolt-tui",
    "crates/deadboltctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/NullAngst/DeadboltTT"
authors = ["Zack <zack98@protonmail.com>"]
rust-version = "1.88"

# Caret ranges only. CI runs `cargo update` before every release build.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
nix = { version = "0.31", features = ["socket", "uio", "fs", "user", "signal", "process", "mount"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process", "fs"] }
regex = "1"
infer = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
