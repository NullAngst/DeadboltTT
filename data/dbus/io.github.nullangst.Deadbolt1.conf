<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name. Anyone may call it: polkit decides inside the daemon. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.nullangst.Deadbolt1"/>
    <allow send_destination="io.github.nullangst.Deadbolt1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.nullangst.Deadbolt1"/>
    <allow receive_sender="io.github.nullangst.Deadbolt1"/>
  </policy>
</busconfig>
