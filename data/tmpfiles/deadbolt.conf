# Deadbolt state, logs and config. The daemon refuses to start if these are
# writable by anyone but root.
d /etc/deadbolt 0755 root root -
d /var/lib/deadbolt 0755 root root -
d /var/lib/deadbolt/quarantine 0700 root root -
d /var/lib/deadbolt/incidents 0700 root root -
d /var/log/deadbolt 0755 root root -
d /etc/systemd/system/deadbolt-scan@quick.timer.d 0755 root root -
d /etc/systemd/system/deadbolt-scan@home.timer.d 0755 root root -
d /etc/systemd/system/deadbolt-scan@full.timer.d 0755 root root -
d /etc/systemd/system/deadbolt-scan@custom.timer.d 0755 root root -
